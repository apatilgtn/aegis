# Runs on push to main — i.e. after a human has approved the change in
# ServiceNow AND merged the PR (two independent human gates upstream of
# this pipeline; see mcp_servers/servicenow/client.py and the repo's PR
# flow). This is the only place `terraform apply` runs against real GCP
# infrastructure.

steps:
  - id: terraform-init
    name: hashicorp/terraform:1.9
    entrypoint: terraform
    args: ["-chdir=infra", "init"]

  - id: terraform-plan
    name: hashicorp/terraform:1.9
    entrypoint: terraform
    args: ["-chdir=infra", "plan", "-out=tfplan"]

  - id: terraform-apply
    name: hashicorp/terraform:1.9
    entrypoint: terraform
    args: ["-chdir=infra", "apply", "-auto-approve", "tfplan"]

options:
  logging: CLOUD_LOGGING_ONLY

serviceAccount: "projects/ual-demo-af168/serviceAccounts/aegis-pipeline@ual-demo-af168.iam.gserviceaccount.com"
